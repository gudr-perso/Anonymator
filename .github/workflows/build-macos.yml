# Build macOS (Apple Silicon) d'Anonymator.
#
# PyInstaller ne cross-compile pas : le .app doit etre construit sur macOS.
# Ce workflow evite d'avoir a posseder un Mac. Le runner macos-14 est arm64,
# ce qui correspond a la seule cible viable : PyTorch ne publie plus de wheels
# macOS x86_64 depuis la 2.3, les Macs Intel sont donc hors perimetre.
#
# Le .app produit est signe ad-hoc par PyInstaller (obligatoire sur arm64 pour
# qu'il s'execute), mais NI signe Developer ID NI notarise : c'est un choix
# assume, l'usage macOS etant strictement local. L'artefact telecharge depuis
# cette page porte donc le drapeau de quarantaine, a lever une fois :
#   xattr -dr com.apple.quarantine ~/Downloads/CAPnonyme.app
# (Un build local via scripts/build.sh ne pose pas ce probleme : la quarantaine
# ne frappe que les fichiers telecharges.) Cf. docs/RELEASE.md, section macOS.
name: build-macos

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Marque a construire"
        type: choice
        options: [cap, cuma, dev, all]
        default: cap
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14        # arm64 (Apple Silicon)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Aligne sur l'environnement de developpement Windows (.venv en 3.14) :
      # un interpreteur different entre dev et CI est une source classique de
      # divergence. Si une wheel macOS arm64 manque pour cp314 (PySide6 est le
      # candidat le plus probable), se rabattre sur '3.12'.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Non bloquant : l'objet de ce workflow est de prouver que le gel
      # PyInstaller passe sur macOS, pas de valider la suite de tests (qui a
      # son propre garde-fou sous Windows).
      - name: Tests (indicatif)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build
        run: ./scripts/build.sh "${{ inputs.brand || 'all' }}"

      # Le vrai piege de PyInstaller n'est pas le build mais le demarrage :
      # dylib manquante, plugin Qt absent... On lance donc chaque binaire gele
      # en mode offscreen et on verifie qu'il est toujours vivant apres 30 s.
      - name: Smoke test des bundles
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for app in dist/*.app; do
            found=1
            name="$(basename "$app" .app)"
            echo "== Demarrage de $name =="
            "$app/Contents/MacOS/$name" &
            pid=$!
            sleep 30
            if kill -0 "$pid" 2>/dev/null; then
              echo "OK : $name tourne toujours apres 30 s"
              kill "$pid" 2>/dev/null || true
            else
              wait "$pid" && rc=0 || rc=$?
              echo "ECHEC : $name s'est arrete (code $rc)" >&2
              exit 1
            fi
          done
          [ "$found" = 1 ] || { echo "Aucun .app dans dist/" >&2; exit 1; }

      - name: Publier les archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anonymator-macos-arm64
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0     # deja compresse par ditto
          retention-days: 14
